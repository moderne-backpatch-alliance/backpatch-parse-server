  note: "upstream's jasmine specs of this counter's neighbourhood (the spec files around the fix that the verify run chose per CVE, listed below) on the packed package, MongoDB 8.0.4 standalone at the tested commit: 687 tests, 662 passed, 0 failed, 25 skipped (spec files: spec/vulnerabilities.spec.js spec/ParseRelation.spec.js spec/ProtectedFields.spec.js spec/DatabaseController.spec.js spec/ParseACL.spec.js spec/ParseQuery.spec.js; a skipped spec includes one npmjs 9.8.0 also failed in the verify's run of these files).. The CVE tests (spec/vulnerabilities.spec.js), with this release's production lines reverted at the tested commit: 283 tests, 2 passed, 8 failed, 273 skipped; with them: 283 tests, 10 passed, 0 failed, 273 skipped. Built with npm run build (babel src -> lib) in a directory named parse-server, 238 of npmjs's 249 files for 9.8.0 are identical; the rest are lib/Controllers/DatabaseController.js, lib/Controllers/FilesController.js, lib/GraphQL/ParseGraphQLServer.js, lib/LiveQuery/ParseLiveQueryServer.js, lib/RestQuery.js, lib/Routers/FilesRouter.js, lib/Routers/UsersRouter.js, lib/Utils.js, lib/batch.js, lib/middlewares.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. The neighbourhood's shared flake 'Parse.Query testing order by createdAt' failed in the verify's neighbourhood run on npmjs 9.8.0 as on this fix's port (1 of 1 run each) and passed 3 of 3 runs alone on both; where it fails here it is recorded as skipped, since npmjs 9.8.0 fails it in the same run."
